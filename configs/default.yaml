runtime:
  seed: 42
  total_episodes: 400
  debug_all: false
  iteration_size: 8
  checkpoint_every_episodes: 10
  log_level: INFO

task_execution:
  enabled: true
  python_executable: python
  timeout_seconds: 5
  max_red_generation_attempts: 3
  capture_max_chars: 1600
  min_code_lines_for_repair: 10
  probabilistic_repair_probability: 0.5
  passed_task_keep_probability: 0.2

storage:
  root_dir: ./runs/30_04
  keep_last_n_checkpoints: 2
  hard_buffer_max_size: 2048

curriculum:
  reward_ema_alpha: 0.2
  low_reward_boost: 1.5
  iteration_weak_topic_boost: 0.15
  repeat_topic_reset_threshold: 5
  adaptive_weighting_until_iteration: 150
  post_adaptation_topic_weight: 1.0
  topics:
    - name: Conditional Statements
      weight: 1.0
    - name: Functions and Scope
      weight: 1.0
    - name: Recursion and Generators
      weight: 1.0
    - name: Dictionaries and Sets
      weight: 1.0
    - name: Sorting and Key Functions
      weight: 1.0
    - name: Strings and Parsing
      weight: 1.0
    - name: Objects and Classes
      weight: 1.0
    - name: NumPy and Linear Algebra
      weight: 1.0
    - name: Decorators and Closures
      weight: 1.0
    - name: Exception Handling and Custom Exceptions
      weight: 1.0
    - name: Mutable State and Aliasing
      weight: 1.0
    - name: Inheritance, MRO, and Dunder Methods
      weight: 1.0
    - name: Lists, Tuples, and Slicing
      weight: 1.0
    - name: Loops and Iteration
      weight: 1.0
    - name: Arithmetic and Type Conversion
      weight: 1.0

socratic:
  # Choose "grpo" for online reward optimization or "dpo" for Judge-ranked
  # preference learning over multiple sampled hints per task.
  training_method: dpo
  model_name_or_path: Qwen/Qwen3-1.7B
  tokenizer_name_or_path:
  base_adapter_path:
  quantization: 8bit
  enable_thinking: false
  hardware:
    gpu_ids: [1]
    persistent: false
    per_gpu_memory_gib: 40
    cpu_offload_gib: 128
  generation:
    batch_size: 1
    max_new_tokens: 180
    temperature: 1.20
    top_p: 0.9
    do_sample: true
    repetition_penalty: 1.05
  lora:
    enabled: true
    r: 64
    alpha: 128
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
  grpo:
    update_every_episodes: 4
    min_episodes_before_update: 2
    max_training_examples: 10
    learning_rate: 5.0e-5
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_ratio: 0.03
    weight_decay: 0.0
    beta: 0.02
    max_prompt_length: 1536
    max_completion_length: 256
    num_generations: 4
    logging_steps: 10
    save_steps: 100
    save_total_limit: 2
    bf16: true
    fp16: false
    gradient_checkpointing: true
    full_ft: false
  dpo:
    update_every_episodes: 8
    min_preference_pairs_before_update: 16
    max_training_pairs: 128
    num_hint_candidates: 4
    max_pairs_per_task: 2
    min_score_gap: 0.10
    learning_rate: 5.0e-5
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_ratio: 0.03
    weight_decay: 0.0
    beta: 0.1
    max_length: 2048
    max_prompt_length: 1536
    logging_steps: 10
    save_steps: 100
    save_total_limit: 2
    bf16: true
    fp16: false
    gradient_checkpointing: true
    full_ft: false

judge:
  model_name_or_path: Qwen/Qwen3-32B
  tokenizer_name_or_path:
  base_adapter_path:
  inference_backend: vllm_server
  vllm_base_url: http://localhost:8000/v1
  vllm_api_key: EMPTY
  vllm_timeout_seconds: 120
  vllm_max_retries: 2
  quantization: 8bit
  enable_thinking: false
  reward_weights:
    bug_localization: 0.25
    usefulness: 0.25
    socratic_style: 0.25
    technical_accuracy: 0.25
  batch_spread_strength: 0.15
  episode_batch_size: 1
  bad_task_threshold: 3.0
  normalize_across_batches: 8
  examples:
    # Anti-example: solution write-up with "Solution:" + "let's debug"
    - statement: "Count vowels in a string."
      code: |
        def count_vowels(s):
            return sum(1 for ch in s if ch in 'aeiou')
        assert count_vowels('Apple') == 2
      observed_failure: "AssertionError: assert 1 == 2"
      hint_text: "Solution: let's debug this by lowercasing each character before the membership test."
      expected_criteria_scores:
        bug_localization: 2
        usefulness: 2
        socratic_style: 1
        technical_accuracy: 2
      expected_no_solution_reveal: false
      expected_task_quality: 8
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: false
      explanation: "Starts with 'Solution:' and 'let's debug', then states the fix. Not Socratic. Style is the lowest."

    # Anti-example: answer-shaped question with exact operator replacement
    - statement: "Return the average of integer readings."
      code: |
        def average_reading(values):
            return sum(values) // len(values)
        assert average_reading([1, 2]) == 1.5
      observed_failure: "AssertionError: assert 1 == 1.5"
      hint_text: "What happens if you use / instead of // in the return expression?"
      expected_criteria_scores:
        bug_localization: 2
        usefulness: 2
        socratic_style: 2
        technical_accuracy: 8
      expected_no_solution_reveal: false
      expected_task_quality: 8
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: false
      explanation: "Question form still gives the exact operator replacement, so it leaks the solution."

    # Anti-example: hallucinated bug on a passed task
    - statement: "Check if a number is even."
      code: |
        def is_even(n):
            return n % 2 == 0
        assert is_even(4) is True
        assert is_even(5) is False
      observed_failure: "Program exited successfully. No failing assertion or runtime error was reproduced."
      hint_text: "Let's debug the condition around the modulo result and find why odd numbers are handled incorrectly."
      expected_criteria_scores:
        bug_localization: 1
        usefulness: 2
        socratic_style: 4
        technical_accuracy: 2
      expected_no_solution_reveal: true
      expected_task_quality: 2
      expected_task_is_valid_for_socratic: false
      expected_hint_is_valid_for_socratic: false
      explanation: "Run passed; hint invents a non-existent failure. Task should be marked invalid."

    # Generic safe Socratic mid baseline
    - statement: "Return the first duplicate in a list, or None if there is none."
      code: |
        def first_duplicate(nums):
            seen = set()
            for n in nums:
                if n in seen:
                    return None
                seen.add(n)
            return None
        assert first_duplicate([1, 2, 1]) == 1
      observed_failure: "AssertionError: assert None == 1"
      hint_text: "Try stepping through the logic and compare what you expect with what the code returns."
      expected_criteria_scores:
        bug_localization: 4
        usefulness: 5
        socratic_style: 5
        technical_accuracy: 5
      expected_no_solution_reveal: true
      expected_task_quality: 8
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: true
      explanation: "Safe Socratic but not grounded in the actual buggy branch. Style is OK, localization weak."

    # Ideal Socratic one focused, grounded question
    - statement: "Split a CSV line, respecting double-quoted fields that may contain commas."
      code: |
        def split_csv(line):
            fields = []
            cur = ''
            quoted = False
            for ch in line:
                quoted = not quoted if ch == '"' else quoted
                if ch == ',' and not quoted:
                    fields.append(cur)
                    cur = ''
                else:
                    cur += ch
            fields.append(cur)
            return fields
        assert split_csv('a,"b,c",d') == ['a', 'b,c', 'd']
      observed_failure: "AssertionError: assert ['a', '\"b', 'c\"', 'd'] == ['a', 'b,c', 'd']"
      hint_text: "On the failing input, what value does quoted have when the comma inside b,c is read, and which line in split_csv changes that flag?"
      expected_criteria_scores:
        bug_localization: 9
        usefulness: 9
        socratic_style: 9
        technical_accuracy: 9
      expected_no_solution_reveal: true
      expected_task_quality: 9
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: true
      explanation: "One focused question grounded in the actual failing input, the variable name, and a specific line. Style is the highest."

  socratic_ranking_examples:
    - statement: "Return the average of integer readings."
      code: |
        def average_reading(values):
            return sum(values) // len(values)
        assert average_reading([1, 2]) == 1.5
      observed_failure: "AssertionError: assert 1 == 1.5"
      hints:
        - id: h0
          text: "Before choosing an operation, what value does the return line produce for [1, 2], and how does its type compare with the expected value?"
        - id: h1
          text: "Use / instead of // in the return expression."
        - id: h2
          text: "Look at the code carefully and think about the math."
      ranked_hint_ids: [h0, h2, h1]
      invalid_hint_ids: [h1]
      leak_hint_ids: [h1]
      task_quality: 8
      task_is_valid_for_socratic: true
      explanation: "h0 localizes without the edit; h1 leaks the exact operator."

    - statement: "Track the highest score seen by a player."
      code: |
        class ScoreTracker:
            def __init__(self):
                self.best = 0
            def add(self, player, score):
                best = max(self.best, score)
                return best
        tracker = ScoreTracker()
        assert tracker.add('a', 10) == 10
        assert tracker.add('a', 5) == 10
      observed_failure: "AssertionError: assert 5 == 10"
      hints:
        - id: h0
          text: "When add is called a second time, which value is supposed to remember the previous score, and where is that value stored after the first call?"
        - id: h1
          text: "Make best an instance variable so it persists."
        - id: h2
          text: "What changes between the first and second call?"
      ranked_hint_ids: [h0, h2, h1]
      invalid_hint_ids: [h1]
      leak_hint_ids: [h1]
      task_quality: 8
      task_is_valid_for_socratic: true
      explanation: "h1 directly names the storage fix."

  red_evaluation_examples:
    - statement: "Return the first duplicate in a list, or None if there is none."
      code: |
        def first_duplicate(nums):
            seen = set()
            for n in nums:
                if n in seen:
                    return None
                seen.add(n)
            return None
        assert first_duplicate([1, 2, 1]) == 1
      observed_failure: "AssertionError: assert None == 1"
      task_quality: 8
      debugging_difficulty: 5
      targets_socratic_weakness: 7
      task_is_valid_for_red_training: true
      explanation: "Coherent failing task with a semantic branch bug."

    - statement: "Check if a number is even."
      code: |
        def is_even(n):
            return n % 2 == 0
        assert is_even(4) is True
        assert is_even(5) is False
      observed_failure: "Program exited successfully. No failing assertion or runtime error was reproduced."
      task_quality: 2
      debugging_difficulty: 1
      targets_socratic_weakness: 1
      task_is_valid_for_red_training: false
      reason_not_valid: "already_correct_code"
      explanation: "No reproduced failure, so this should not train Red as a successful adversarial task."
  hardware:
    gpu_ids: [0]
    persistent: true
    per_gpu_memory_gib: 46
    cpu_offload_gib: 128
  generation:
    batch_size: 1
    max_new_tokens: 2400
    temperature: 0.5
    top_p: 0.7
    do_sample: false
    repetition_penalty: 1.0

red:
  model_name_or_path: Qwen/Qwen3-32B
  tokenizer_name_or_path:
  base_adapter_path:
  quantization:
  generation_quantization: 8bit
  update_quantization: 4bit
  force_base_generation_after_iteration: 17
  enable_thinking: false
  hardware:
    gpu_ids: [2, 3]
    persistent: false
    per_gpu_memory_gib: 40
    cpu_offload_gib: 128
  generation:
    batch_size: 1
    max_new_tokens: 4096
    max_context_tokens: 16384
    temperature: 1.1
    top_p: 0.90
    do_sample: true
    repetition_penalty: 1.02
  lora:
    enabled: true
    r: 32
    alpha: 128
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
  update:
    update_every_episodes: 8
    min_hard_examples: 4
    max_sft_examples: 256
    max_dpo_pairs: 64
    mining_bottom_fraction: 0.25
    hard_reward_max: 0.80
    learning_rate: 4.0e-5
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 8
    max_length: 4096
    logging_steps: 10
    dpo_enabled: true
    dpo_beta: 0.1
