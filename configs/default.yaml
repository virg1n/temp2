runtime:
  seed: 42
  total_episodes: 400
  debug_all: false
  iteration_size: 8
  checkpoint_every_episodes: 10
  log_level: INFO

task_execution:
  enabled: true
  python_executable: python
  timeout_seconds: 5
  max_red_generation_attempts: 3
  capture_max_chars: 1600
  min_code_lines_for_repair: 10
  probabilistic_repair_probability: 0.5
  passed_task_keep_probability: 0.2

storage:
  root_dir: ./runs/30_04
  keep_last_n_checkpoints: 2
  hard_buffer_max_size: 2048

curriculum:
  reward_ema_alpha: 0.2
  low_reward_boost: 1.5
  iteration_weak_topic_boost: 0.15
  repeat_topic_reset_threshold: 5
  adaptive_weighting_until_iteration: 150
  post_adaptation_topic_weight: 1.0
  topics:
    - name: Conditional Statements
      weight: 1.0
    - name: Functions and Scope
      weight: 1.0
    - name: Recursion and Generators
      weight: 1.0
    - name: Dictionaries and Sets
      weight: 1.0
    - name: Sorting and Key Functions
      weight: 1.0
    - name: Strings and Parsing
      weight: 1.0
    - name: Objects and Classes
      weight: 1.0
    - name: NumPy and Linear Algebra
      weight: 1.0
    - name: Decorators and Closures
      weight: 1.0
    - name: Exception Handling and Custom Exceptions
      weight: 1.0
    - name: Mutable State and Aliasing
      weight: 1.0
    - name: Inheritance, MRO, and Dunder Methods
      weight: 1.0
    - name: Lists, Tuples, and Slicing
      weight: 1.0
    - name: Loops and Iteration
      weight: 1.0
    - name: Arithmetic and Type Conversion
      weight: 1.0

socratic:
  # Choose "grpo" for online reward optimization or "dpo" for Judge-ranked
  # preference learning over multiple sampled hints per task.
  training_method: dpo
  model_name_or_path: Qwen/Qwen3-1.7B
  tokenizer_name_or_path:
  base_adapter_path:
  quantization: 8bit
  enable_thinking: false
  hardware:
    gpu_ids: [1]
    persistent: false
    per_gpu_memory_gib: 40
    cpu_offload_gib: 128
  generation:
    batch_size: 1
    max_new_tokens: 180
    temperature: 1.20
    top_p: 0.9
    do_sample: true
    repetition_penalty: 1.05
  lora:
    enabled: true
    r: 64
    alpha: 128
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
  grpo:
    update_every_episodes: 4
    min_episodes_before_update: 2
    max_training_examples: 10
    learning_rate: 5.0e-5
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_ratio: 0.03
    weight_decay: 0.0
    beta: 0.02
    max_prompt_length: 1536
    max_completion_length: 256
    num_generations: 4
    logging_steps: 10
    save_steps: 100
    save_total_limit: 2
    bf16: true
    fp16: false
    gradient_checkpointing: true
    full_ft: false
  dpo:
    update_every_episodes: 8
    min_preference_pairs_before_update: 16
    max_training_pairs: 128
    num_hint_candidates: 4
    max_pairs_per_task: 2
    min_score_gap: 0.10
    learning_rate: 5.0e-5
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_ratio: 0.03
    weight_decay: 0.0
    beta: 0.1
    max_length: 2048
    max_prompt_length: 1536
    logging_steps: 10
    save_steps: 100
    save_total_limit: 2
    bf16: true
    fp16: false
    gradient_checkpointing: true
    full_ft: false

judge:
  model_name_or_path: Qwen/Qwen3-32B
  tokenizer_name_or_path:
  base_adapter_path:
  inference_backend: vllm_server
  vllm_base_url: http://localhost:8000/v1
  vllm_api_key: EMPTY
  vllm_timeout_seconds: 120
  vllm_max_retries: 2
  quantization: 8bit
  enable_thinking: false
  reward_weights:
    bug_localization: 0.25
    usefulness: 0.25
    socratic_style: 0.25
    technical_accuracy: 0.25
  batch_spread_strength: 0.15
  episode_batch_size: 1
  bad_task_threshold: 3.0
  normalize_across_batches: 8
  red_task_batch_size: 4
  examples:
    # Anti-example: solution write-up with "Solution:" + "let's debug"
    - statement: "Count vowels in a string."
      code: |
        def count_vowels(s):
            return sum(1 for ch in s if ch in 'aeiou')
        assert count_vowels('Apple') == 2
      observed_failure: "AssertionError: assert 1 == 2"
      hint_text: "Solution: let's debug this by lowercasing each character before the membership test."
      expected_criteria_scores:
        bug_localization: 2
        usefulness: 2
        socratic_style: 1
        technical_accuracy: 2
      expected_no_solution_reveal: false
      expected_task_quality: 8
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: false
      explanation: "Starts with 'Solution:' and 'let's debug', then states the fix. Not Socratic. Style is the lowest."

    # Anti-example: hallucinated bug on a passed task
    - statement: "Check if a number is even."
      code: |
        def is_even(n):
            return n % 2 == 0
        assert is_even(4) is True
        assert is_even(5) is False
      observed_failure: "Program exited successfully. No failing assertion or runtime error was reproduced."
      hint_text: "Let's debug the condition around the modulo result and find why odd numbers are handled incorrectly."
      expected_criteria_scores:
        bug_localization: 1
        usefulness: 2
        socratic_style: 4
        technical_accuracy: 2
      expected_no_solution_reveal: true
      expected_task_quality: 2
      expected_task_is_valid_for_socratic: false
      expected_hint_is_valid_for_socratic: false
      explanation: "Run passed; hint invents a non-existent failure. Task should be marked invalid."

    # Generic safe Socratic mid baseline
    - statement: "Return the first duplicate in a list, or None if there is none."
      code: |
        def first_duplicate(nums):
            seen = set()
            for n in nums:
                if n in seen:
                    return None
                seen.add(n)
            return None
        assert first_duplicate([1, 2, 1]) == 1
      observed_failure: "AssertionError: assert None == 1"
      hint_text: "Try stepping through the logic and compare what you expect with what the code returns."
      expected_criteria_scores:
        bug_localization: 4
        usefulness: 5
        socratic_style: 5
        technical_accuracy: 5
      expected_no_solution_reveal: true
      expected_task_quality: 8
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: true
      explanation: "Safe Socratic but not grounded in the actual buggy branch. Style is OK, localization weak."

    # Ideal Socratic one focused, grounded question
    - statement: "Split a CSV line, respecting double-quoted fields that may contain commas."
      code: |
        def split_csv(line):
            fields = []
            cur = ''
            quoted = False
            for ch in line:
                quoted = not quoted if ch == '"' else quoted
                if ch == ',' and not quoted:
                    fields.append(cur)
                    cur = ''
                else:
                    cur += ch
            fields.append(cur)
            return fields
        assert split_csv('a,"b,c",d') == ['a', 'b,c', 'd']
      observed_failure: "AssertionError: assert ['a', '\"b', 'c\"', 'd'] == ['a', 'b,c', 'd']"
      hint_text: "On the failing input, what value does quoted have when the comma inside b,c is read, and which line in split_csv changes that flag?"
      expected_criteria_scores:
        bug_localization: 9
        usefulness: 9
        socratic_style: 9
        technical_accuracy: 9
      expected_no_solution_reveal: true
      expected_task_quality: 9
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: true
      explanation: "One focused question grounded in the actual failing input, the variable name, and a specific line. Style is the highest."

    # Anti-example: exact operator replacement is a solution leak
    - statement: "Compute the average of non-empty numeric lists."
      code: |
        def average(nums):
            return sum(nums) // len(nums)
        assert average([1, 2]) == 1.5
      observed_failure: "AssertionError: assert 1 == 1.5"
      hint_text: "The correct approach is to use / instead of // in the return expression."
      expected_criteria_scores:
        bug_localization: 2
        usefulness: 2
        socratic_style: 0
        technical_accuracy: 2
      expected_no_solution_reveal: false
      expected_task_quality: 8
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: false
      explanation: "Names the exact operator swap, so it leaks the answer."

    # Good Socratic concise question without replacement expression
    - statement: "Keep a running total on an object across method calls."
      code: |
        class Counter:
            def __init__(self):
                self.total = 0
            def add(self, amount):
                total = self.total
                total += amount
                return total
        c = Counter()
        assert c.add(2) == 2
        assert c.add(3) == 5
      observed_failure: "AssertionError: assert 3 == 5"
      hint_text: "After the first call to add, which attribute on c actually changes, and what value does the second call read before adding 3?"
      expected_criteria_scores:
        bug_localization: 9
        usefulness: 9
        socratic_style: 9
        technical_accuracy: 9
      expected_no_solution_reveal: true
      expected_task_quality: 8
      expected_task_is_valid_for_socratic: true
      expected_hint_is_valid_for_socratic: true
      explanation: "Grounded in the object state without saying the exact fix."
  red_examples:
    # Valid Red task: coherent bug, correct tests, meaningful stateful behavior
    - topic: "Objects and Classes"
      statement: "Implement a small cache that tracks hits and misses."
      code: |
        class Cache:
            def __init__(self):
                self.data = {}
                self.hits = 0
                self.misses = 0
            def get(self, key, default=None):
                if key in self.data:
                    self.hits += 1
                    return self.data[key]
                self.hits += 1
                return default
            def put(self, key, value):
                self.data[key] = value
        c = Cache()
        assert c.get("x") is None
        assert c.misses == 1
        c.put("x", 4)
        assert c.get("x") == 4
        assert c.hits == 1
      observed_failure: "AssertionError: assert 0 == 1"
      red_spec:
        topic: "Objects and Classes"
        target_function: "Cache.get"
        intended_bug: "The miss path increments hits instead of misses."
        expected_first_failure: "assert c.misses == 1"
        metadata:
          failure_mode: "wrong state counter update"
          difficulty: "medium"
      expected_task_quality: 9
      expected_task_hardness: 7
      expected_task_is_valid_for_socratic: true
      expected_red_rejection_reason:

    # Invalid Red task: buggy code already passes, so it is not useful
    - topic: "Arithmetic and Type Conversion"
      statement: "Return half of a number as a float."
      code: |
        def half(n):
            return n / 2
        assert half(3) == 1.5
        assert half(4) == 2.0
      observed_failure: "Program exited successfully. No failing assertion or runtime error was reproduced."
      red_spec:
        topic: "Arithmetic and Type Conversion"
        target_function: "half"
        intended_bug: "Uses floor division instead of true division."
        expected_first_failure: "assert half(3) == 1.5"
        metadata:
          failure_mode: "missing intended bug"
          difficulty: "medium"
      expected_task_quality: 2
      expected_task_hardness: 2
      expected_task_is_valid_for_socratic: false
      expected_red_rejection_reason: "already_correct_code"
  hardware:
    gpu_ids: [0]
    persistent: true
    per_gpu_memory_gib: 46
    cpu_offload_gib: 128
  generation:
    batch_size: 1
    max_new_tokens: 2400
    temperature: 0.5
    top_p: 0.7
    do_sample: false
    repetition_penalty: 1.0

red:
  model_name_or_path: Qwen/Qwen3-32B
  tokenizer_name_or_path:
  base_adapter_path:
  quantization:
  generation_quantization: 8bit
  update_quantization: 4bit
  force_base_generation_after_iteration: 17
  enable_thinking: false
  hardware:
    gpu_ids: [2, 3]
    persistent: true
    per_gpu_memory_gib: 40
    cpu_offload_gib: 128
  generation:
    batch_size: 1
    max_new_tokens: 4096
    max_context_tokens: 16384
    temperature: 1.1
    top_p: 0.90
    do_sample: true
    repetition_penalty: 1.02
  lora:
    enabled: true
    r: 32
    alpha: 128
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
  update:
    update_every_episodes: 8
    min_hard_examples: 4
    max_sft_examples: 256
    max_dpo_pairs: 64
    mining_bottom_fraction: 0.25
    hard_reward_max: 0.80
    min_red_reward: 0.50
    learning_rate: 4.0e-5
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 8
    max_length: 4096
    logging_steps: 10
    dpo_enabled: true
    dpo_beta: 0.1
